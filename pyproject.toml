[project]
name = "mjlab-playground"
version = "0.1.0"
description = "Extra tasks for mjlab"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mjlab[cu128]",
    "torch>=2.7.0,<2.10.0",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
mjlab = { workspace = true }

[tool.uv]
constraint-dependencies = [
    "setuptools<81",
]

[tool.uv.workspace]
members = ["../mjlab"]

[tool.ruff]
indent-width = 4
src = ["src/mjlab_playground"]
exclude = ["typings"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pyright]
pythonVersion = "3.13"
ignore = ["./typings"]
stubPath = "typings"
reportWildcardImportFromLibrary = false

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
    "ty>=0.0.14",
]

[project.entry-points."mjlab.tasks"]
mjlab_playground = "mjlab_playground"
